name: Docs

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: kontourai/.github/.github/workflows/docs-gate.yml@main
  pages:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: gate
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: kontourai/.github/.github/workflows/docs-pages.yml@main
    # Pilot: this site runs docs-kit v0.6.0 (selection toolbar, WebMCP) ahead
    # of the org-wide pin. Remove once kontourai/.github pins v0.6.0.
    with:
      docs-kit-ref: bc158849c27e55d25417c443ad6bbd0643dfdbc4
