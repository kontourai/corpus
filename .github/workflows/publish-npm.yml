name: Publish Corpus workspaces

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in both workspace manifests (for example 0.1.0-next.0)
        required: true
        type: string

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      # Carried outside the artifact, so the publish job checks each tarball against
      # what this job verified, not only against the SHA256SUMS shipped beside it.
      conformance_sha256: ${{ steps.hashes.outputs.conformance }}
      store_sha256: ${{ steps.hashes.outputs.store }}
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned npm
        run: npm install --global npm@11.17.0 --ignore-scripts --no-fund --no-audit

      - name: Validate version and preflight both registry versions
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const version = process.env.RELEASE_VERSION;
          const tag = version.split('+')[0].includes('-') ? 'next' : 'latest';
          for (const workspace of ['conformance', 'store']) {
            const metadata = JSON.parse(readFileSync(`packages/${workspace}/package.json`, 'utf8'));
            assert.equal(metadata.version, version, `${workspace} version must match the exact input`);
            execFileSync(process.execPath, ['scripts/npm-publish-guard.mjs', metadata.name, version, tag], { stdio: 'inherit' });
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE

      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm test
      - run: node bin/corpus.mjs check
      - run: npm run build --workspace=@kontourai/corpus-store
      - run: npm run test --workspace=@kontourai/corpus-store
      - name: Verify and export the packed tarballs
        run: npm run verify:pack --workspace=@kontourai/corpus-store -- "$RUNNER_TEMP/corpus-pack"

      - name: Record the verified tarball hashes
        id: hashes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cd "$RUNNER_TEMP/corpus-pack"
          sha256sum --check --strict SHA256SUMS
          for workspace in conformance store; do
            sha256="$(sha256sum "kontourai-corpus-$workspace-$RELEASE_VERSION.tgz" | cut -d' ' -f1)"
            test "${#sha256}" -eq 64
            echo "$workspace=$sha256" >> "$GITHUB_OUTPUT"
          done

      - name: Upload verified tarballs and hashes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-corpus-workspaces
          path: ${{ runner.temp }}/corpus-pack/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned OIDC-capable npm
        run: npm install --global npm@11.17.0 --ignore-scripts --no-fund --no-audit

      - name: Download verified tarballs and hashes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-corpus-workspaces
          path: ${{ runner.temp }}/corpus-pack/

      - name: Check downloaded hashes against the verify job's outputs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CONFORMANCE_SHA256: ${{ needs.verify.outputs.conformance_sha256 }}
          STORE_SHA256: ${{ needs.verify.outputs.store_sha256 }}
        run: |
          cd "$RUNNER_TEMP/corpus-pack"
          sha256sum --check --strict SHA256SUMS
          test "${#CONFORMANCE_SHA256}" -eq 64
          test "${#STORE_SHA256}" -eq 64
          printf '%s  %s\n' "$CONFORMANCE_SHA256" "kontourai-corpus-conformance-$RELEASE_VERSION.tgz" "$STORE_SHA256" "kontourai-corpus-store-$RELEASE_VERSION.tgz" > "$RUNNER_TEMP/verified-sha256"
          sha256sum --check --strict "$RUNNER_TEMP/verified-sha256"

      - name: Preflight both registry versions before publishing
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          for workspace in conformance store; do
            node scripts/npm-publish-guard.mjs "@kontourai/corpus-$workspace" "$RELEASE_VERSION" "$DIST_TAG"
          done

      - name: Publish the packed tarballs with provenance
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          for workspace in conformance store; do
            node scripts/npm-publish-guard.mjs "@kontourai/corpus-$workspace" "$RELEASE_VERSION" "$DIST_TAG"
            (cd "$RUNNER_TEMP/corpus-pack" && sha256sum --check --strict "$RUNNER_TEMP/verified-sha256")
            npm publish "$RUNNER_TEMP/corpus-pack/kontourai-corpus-$workspace-$RELEASE_VERSION.tgz" --access public --provenance --ignore-scripts --tag "$DIST_TAG"
          done
