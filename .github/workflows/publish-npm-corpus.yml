name: Publish Corpus CLI

# Publishes the root @kontourai/corpus package only. The store and conformance
# workspaces have their own prerelease cadence and workflow (publish-npm.yml).
# npm's trusted publisher for @kontourai/corpus names this file, so neither
# workflow can publish the other's packages.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in the root package.json and the first CHANGELOG.md section (for example 0.8.0)
        required: true
        type: string

concurrency:
  group: publish-npm-corpus
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      # Carried outside the artifact, so the publish job checks the tarball against
      # what this job verified, not only against the SHA256SUMS shipped beside it.
      sha256: ${{ steps.tarball.outputs.sha256 }}
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned npm
        run: npm install --global npm@11.17.0 --ignore-scripts --no-fund --no-audit

      - name: Validate version, changelog, and registry absence
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/root-release-preflight.mjs "$RELEASE_VERSION"
          case "${RELEASE_VERSION%%+*}" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          node scripts/npm-publish-guard.mjs @kontourai/corpus "$RELEASE_VERSION" "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm test
      - run: node bin/corpus.mjs check

      - name: Verify and export the packed tarball
        run: npm run verify:pack -- "$RUNNER_TEMP/corpus-root-pack"

      - name: Require exactly the expected tarball
        id: tarball
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cd "$RUNNER_TEMP/corpus-root-pack"
          test "$(find . -mindepth 1 | wc -l)" -eq 2
          test -f "kontourai-corpus-$RELEASE_VERSION.tgz"
          test "$(wc -l < SHA256SUMS)" -eq 1
          grep -q "  kontourai-corpus-$RELEASE_VERSION.tgz\$" SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          sha256="$(sha256sum "kontourai-corpus-$RELEASE_VERSION.tgz" | cut -d' ' -f1)"
          test "${#sha256}" -eq 64
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload verified tarball and hash
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-corpus-root
          path: ${{ runner.temp }}/corpus-root-pack/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned OIDC-capable npm
        run: npm install --global npm@11.17.0 --ignore-scripts --no-fund --no-audit

      - name: Download verified tarball and hash
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-corpus-root
          path: ${{ runner.temp }}/corpus-root-pack/

      - name: Check downloaded hash against the verify job's output
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          VERIFIED_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          cd "$RUNNER_TEMP/corpus-root-pack"
          sha256sum --check --strict SHA256SUMS
          test "${#VERIFIED_SHA256}" -eq 64
          printf '%s  %s\n' "$VERIFIED_SHA256" "kontourai-corpus-$RELEASE_VERSION.tgz" > "$RUNNER_TEMP/verified-sha256"
          sha256sum --check --strict "$RUNNER_TEMP/verified-sha256"

      - name: Preflight the registry version before publishing
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.tag }}
        run: node scripts/npm-publish-guard.mjs @kontourai/corpus "$RELEASE_VERSION" "$DIST_TAG"

      - name: Publish the packed tarball with provenance
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          node scripts/npm-publish-guard.mjs @kontourai/corpus "$RELEASE_VERSION" "$DIST_TAG"
          (cd "$RUNNER_TEMP/corpus-root-pack" && sha256sum --check --strict "$RUNNER_TEMP/verified-sha256")
          npm publish "$RUNNER_TEMP/corpus-root-pack/kontourai-corpus-$RELEASE_VERSION.tgz" --access public --provenance --ignore-scripts --tag "$DIST_TAG"
